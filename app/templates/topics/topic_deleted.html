{% extends "base.html" %}

{% block title %}{{ _('Topic Deleted') }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card p-5 shadow-sm mx-auto" style="max-width: 500px; border-radius: 8px;">
        <i class="fas fa-exclamation-triangle fa-3x mb-3" style="color: #772432;"></i>
        <h3 class="mb-3" style="color: #772432; font-weight: 700;">{{ _('Prompt Deleted') }}</h3>
        <p class="text-muted">{{ _('This topic prompt was deleted by the system administrator.') }}</p>
        <a href="{{ url_for('topics_bp.dashboard') }}" class="btn btn-primary mt-3" style="background-color: #772432; border-color: #772432; border-radius: 20px;">
            {{ _('Back to Dashboard') }}
        </a>
    </div>
</div>
{% endblock %}
