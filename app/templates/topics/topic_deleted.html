{% extends "base.html" %}

{% block title %}{{ _('Topic Deleted') }}{% endblock %}

{% block head_extra %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="topics-standalone">
    <div class="topics-standalone-card">
        <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
        <h3>{{ _('Prompt Deleted') }}</h3>
        <p>{{ _('This topic prompt was deleted by the system administrator.') }}</p>
        <a href="{{ url_for('topics_bp.dashboard') }}" class="topics-btn topics-btn--primary">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>{{ _('Back to Dashboard') }}
        </a>
    </div>
</div>
{% endblock %}
